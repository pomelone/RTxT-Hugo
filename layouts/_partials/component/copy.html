<button class="copy-button" type="button">
    <span class="copy-show" title="{{ i18n "copy" }}">
        {{ partial "component/svg-sprite.html" (dict "name" "copy" "class" "icon" "asset" "ui/static-ui.svg") }}
        <!-- <span>{{ i18n "copy" }}</span> -->
    </span>
    <span class="copy-successful" title="{{ i18n "copied" }}">
        {{ partial "component/svg-sprite.html" (dict "name" "copy_check" "class" "icon" "asset" "ui/static-ui.svg") }}
        <!-- <span>{{ i18n "copied" }}</span> -->
    </span>
    <span class="copy-failed" title="{{ i18n "copy_failed" }}">
        {{ partial "component/svg-sprite.html" (dict "name" "copy_failed" "class" "icon" "asset" "ui/static-ui.svg") }}
        <!-- <span>{{ i18n "copy_failed" }}</span> -->
    </span>
</button>
