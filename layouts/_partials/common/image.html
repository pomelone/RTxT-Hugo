{{- $dest := .dest -}}
{{- $alt := .alt -}}
{{- $title := .title -}}

{{- $src := $dest -}}

<figure>
    <img src="{{ $src | safeURL }}"{{ with $alt }} alt="{{ . }}"{{ end }}{{ with $title }} title="{{ . }}"{{ end }} loading="lazy" decoding="async" crossorigin="anonymous">
    {{- with $title -}}
    <figcaption>{{ . }}</figcaption>
    {{- end -}}
</figure>
