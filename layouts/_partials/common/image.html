{{- $dest := .dest -}}
{{- $alt := .alt -}}
{{- $title := .title -}}
{{- $page := .page -}}

{{- $src := strings.TrimSpace (partial "common/resolve-ref.html" (dict "dest" $dest "page" $page)) -}}

<figure>
    <img src="{{ $src | safeURL }}"{{ with $alt }} alt="{{ . }}"{{ end }}{{ with $title }} title="{{ . }}"{{ end }} loading="lazy" decoding="async" crossorigin="anonymous" />
    {{- with $title -}}
    <figcaption>{{ . }}</figcaption>
    {{- end -}}
</figure>
