{{- $dest := .dest -}}
{{- $alt := .alt -}}
{{- $title := .title -}}

<figure>
    <img src="{{ $dest | safeURL }}"{{ with $alt }} alt="{{ $alt }}"{{ end }}{{ with $title }} title="{{ . }}"{{ end }} loading="lazy" decoding="async" crossorigin="anonymous">
    {{- with $title -}}
    <figcaption>{{ . }}</figcaption>
    {{- end -}}
</figure>
