{{- $url := urls.Parse .Destination -}}

{{- if or (eq $url.Scheme "http") (eq $url.Scheme "https") -}}
<a href="{{ .Destination | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }} target="_blank" rel="noopener noreferrer">
{{- else -}}
<a href="{{ .Destination | safeURL }}">
{{- end -}}
    {{- with .Text -}}
        {{- . | safeHTML -}}
    {{- end -}}
</a>
