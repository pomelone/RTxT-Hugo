{{- $dest := .Destination | safeURL -}}
{{- $alt := .Text -}}
{{- $title := .Title -}}
<figure>
    <img src="{{ $dest }}" alt="{{ $alt }}"{{ with $title }} title="{{ . }}"{{ end }} loading="lazy" decoding="async">
    {{ with $title -}}
    <figcaption>{{ . }}</figcaption>
    {{- end }}
</figure>
